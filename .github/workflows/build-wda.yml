name: Build WDA Photos Experiment

on:
  push:
    branches:
      - photos-experiment
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Inspect project
        run: |
          echo "=== PROJECT ==="
          ls -la
          echo "=== XCODE PROJECT ==="
          ls -la WebDriverAgent.xcodeproj

      - name: Build WebDriverAgentLib
        run: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -target WebDriverAgentLib \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Locate build products
        run: |
          echo "=== BUILD PRODUCTS ==="
          find "$HOME/Library/Developer/Xcode/DerivedData" -type d \( -name "*.framework" -o -name "*.app" \) -print | head -100

      - name: Package build output
        run: |
          mkdir -p artifacts

          PRODUCT_DIR=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d \
            -path "*/Build/Products/Debug-iphoneos" \
            -print \
            | head -1)

          echo "=== PRODUCT_DIR ==="
          echo "$PRODUCT_DIR"

          if [ -n "$PRODUCT_DIR" ] && [ -d "$PRODUCT_DIR" ]; then
            cp -R "$PRODUCT_DIR" "artifacts/"
          else
            echo "ERROR: Could not locate Xcode build products"
            exit 1
          fi

          echo "=== ARTIFACTS ==="
          find artifacts -maxdepth 6 -print

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WDA-Photos-Experiment-build
          path: artifacts/
          if-no-files-found: error
          retention-days: 3
