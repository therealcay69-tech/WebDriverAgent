name: Build WDA Photos Experiment

on:
  push:
    branches:
      - photos-experiment
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Inspect project
        run: |
          echo "=== PROJECT ==="
          ls -la
          echo "=== XCODE PROJECT ==="
          ls -la WebDriverAgent.xcodeproj

      - name: Build WebDriverAgentRunner
        run: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build-for-testing

      - name: Locate Runner
        run: |
          echo "=== RUNNER PRODUCTS ==="
          find build -type d \( -name "*.app" -o -name "*.xctest" \) -print

          echo "=== RUNNER APP ==="
          find build -type d -name "WebDriverAgentRunner-Runner.app" -print

      - name: Package Runner
        run: |
          mkdir -p artifacts

          RUNNER_APP=$(find build -type d -name "WebDriverAgentRunner-Runner.app" -print | head -1)

          echo "=== RUNNER_APP ==="
          echo "$RUNNER_APP"

          if [ -n "$RUNNER_APP" ] && [ -d "$RUNNER_APP" ]; then
            cp -R "$RUNNER_APP" "artifacts/"
          else
            echo "ERROR: WebDriverAgentRunner-Runner.app was not found"
            exit 1
          fi

          echo "=== ARTIFACTS ==="
          find artifacts -maxdepth 6 -print
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WDA-Photos-Experiment-build
          path: artifacts/
          if-no-files-found: error
          retention-days: 3
